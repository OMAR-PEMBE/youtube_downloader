x-app-environment: &app-environment
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-docker-development-only}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
  POSTGRES_DB: ${POSTGRES_DB:-youtube_downloader}
  POSTGRES_USER: ${POSTGRES_USER:-youtube_downloader}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CACHE_URL: redis://redis:6379/2
  DOWNLOAD_JOB_TTL_SECONDS: ${DOWNLOAD_JOB_TTL_SECONDS:-3600}
  DOWNLOAD_MAX_ACTIVE_JOBS: ${DOWNLOAD_MAX_ACTIVE_JOBS:-2}
  DOWNLOAD_MAX_DURATION_SECONDS: ${DOWNLOAD_MAX_DURATION_SECONDS:-10800}
  DOWNLOAD_MAX_FILE_SIZE_BYTES: ${DOWNLOAD_MAX_FILE_SIZE_BYTES:-2147483648}
  DOWNLOAD_RATE_LIMIT_COUNT: ${DOWNLOAD_RATE_LIMIT_COUNT:-10}
  DOWNLOAD_RATE_LIMIT_WINDOW_SECONDS: ${DOWNLOAD_RATE_LIMIT_WINDOW_SECONDS:-3600}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-youtube_downloader}
      POSTGRES_USER: ${POSTGRES_USER:-youtube_downloader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment: *app-environment
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A youtube_downloader worker --loglevel=info --concurrency=2
    environment: *app-environment
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A youtube_downloader beat --loglevel=info
    environment: *app-environment
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
