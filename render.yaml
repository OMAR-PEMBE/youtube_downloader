services:
  - type: web
    name: youtube-downloader-web
    runtime: python
    plan: free
    buildCommand: bash scripts/render_build.sh
    startCommand: bash scripts/render_start.sh
    healthCheckPath: /health/ready/
    autoDeployTrigger: commit
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ADMIN_PATH
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: youtube-downloader-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: youtube-downloader-queue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: youtube-downloader-queue
          property: connectionString
      - key: CACHE_URL
        fromService:
          type: keyvalue
          name: youtube-downloader-queue
          property: connectionString
      - key: DOWNLOAD_ROOT
        value: /tmp/download_jobs
      - key: DOWNLOAD_JOB_TTL_SECONDS
        value: "3600"
      - key: DOWNLOAD_STALE_JOB_SECONDS
        value: "900"
      - key: DOWNLOAD_MAX_ACTIVE_JOBS
        value: "1"
      - key: DOWNLOAD_MAX_DURATION_SECONDS
        value: "7200"
      - key: DOWNLOAD_MAX_FILE_SIZE_BYTES
        value: "536870912"
      - key: DOWNLOAD_RATE_LIMIT_COUNT
        value: "5"
      - key: DOWNLOAD_RATE_LIMIT_WINDOW_SECONDS
        value: "3600"
      - key: CELERY_CONCURRENCY
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: WEB_THREADS
        value: "4"

  - type: keyvalue
    name: youtube-downloader-queue
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: youtube-downloader-db
    plan: free
    databaseName: youtube_downloader
    user: youtube_downloader
    ipAllowList: []
